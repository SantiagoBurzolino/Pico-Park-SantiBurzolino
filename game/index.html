<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pico Park</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <!-- ── Pantalla de inicio ─────────────────────────────────────────────── -->
    <!-- Visible por defecto. Se oculta cuando el usuario presiona "Jugar".   -->
    <div id="pantalla-de-inicio" class="visible">
      <div class="tarjeta-de-inicio">
        <h1 class="titulo-del-juego">🎮 Pico Park</h1>
        <p class="descripcion-del-juego">
          Juego cooperativo para hasta 4 jugadores.<br/>
          Conectá tu celular con la IP del servidor.
        </p>
        <div class="instrucciones">
          <div class="instruccion">🗝️ Recogé la llave</div>
          <div class="instruccion">🚪 Llevá a todos a la salida</div>
          <div class="instruccion">🏆 ¡Completen los 2 niveles!</div>
        </div>
        <button id="boton-de-inicio">▶ Jugar</button>
      </div>
    </div>

    <!-- ── Panel de información ───────────────────────────────────────────── -->
    <div id="panel-de-informacion">
      <div id="texto-de-ip">🖥️ Cargando...</div>
      <div id="lista-de-jugadores"></div>
    </div>

    <div id="titulo-del-nivel">Nivel 1 — Alcanzá la Llave</div>
    <div id="indicador-de-llave">🗝️ Nadie tiene la llave</div>

    <!-- ── Pantalla de victoria ───────────────────────────────────────────── -->
    <div id="pantalla-de-victoria">
      <span id="texto-de-victoria">🎉 ¡Nivel completado!</span>
      <button id="boton-para-siguiente-nivel">Siguiente Nivel →</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="game.js"></script>
  </body>
</html>
